<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo Espacial -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Neon Eléctrico -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Metal Cromado -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Efecto de Brillo de Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Oscuro -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Anillo Exterior Neon -->
  <circle cx="250" cy="220" r="170" fill="none" stroke="#1e3a8a" stroke-width="4" opacity="0.5"/>
  <circle cx="250" cy="220" r="160" fill="none" stroke="url(#neonCyan)" stroke-width="6" filter="url(#glow)" />

  <!-- Monograma Central "CD" (CamachoDevs) -->
  <!-- Letra C -->
  <path d="M 210,130 L 150,130 L 120,160 L 120,280 L 150,310 L 210,310" fill="none" stroke="url(#chromeMetal)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" />
  
  <!-- Letra D -->
  <path d="M 210,130 L 280,130 C 340,130 370,170 370,220 C 370,270 340,310 280,310 L 210,310 Z" fill="none" stroke="url(#neonCyan)" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)" />
  <path d="M 210,130 L 280,130 C 340,130 370,170 370,220 C 370,270 340,310 280,310 L 210,310 Z" fill="none" stroke="url(#chromeMetal)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Icono de Código Central </> -->
  <path d="M 225,205 L 205,220 L 225,235 M 275,205 L 295,220 L 275,235 M 257,195 L 243,245" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Texto Principal -->
  <text x="250" y="420" text-anchor="middle" fill="url(#chromeMetal)" font-family="Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="6">CAMACHO DEVS</text>
  
  <!-- Subtexto -->
  <text x="250" y="450" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="8" filter="url(#glow)">SOFTWARE ENGINEERING</text>
</svg>
