<svg xmlns="http://w3.org" viewBox="0 0 500 500">
  <!-- Fondo Solido Premium -->
  <rect width="500" height="500" rx="40" fill="#020617" />

  <!-- Anillo Exterior Neon Brillante -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="#06b6d4" stroke-width="6" />

  <!-- Monograma Central Metalico "C" (CamachoDevs) -->
  <path d="M 210,130 L 150,130 L 120,160 L 120,280 L 150,310 L 210,310" fill="none" stroke="#cbd5e1" stroke-width="24" stroke-linecap="square" />
  
  <!-- Letra D Fusionada Neon -->
  <path d="M 210,130 L 280,130 C 340,130 370,170 370,220 C 370,270 340,310 280,310 L 210,310 Z" fill="none" stroke="#3b82f6" stroke-width="16" />

  <!-- Icono de Codigo Integrado </> -->
  <path d="M 225,205 L 205,220 L 225,235 M 275,205 L 295,220 L 275,235 M 257,195 L 243,245" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Texto Principal del Equipo -->
  <text x="250" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" letter-spacing="6">CAMACHO DEVS</text>
  
  <!-- Subtexto del Area -->
  <text x="250" y="450" text-anchor="middle" fill="#06b6d4" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" letter-spacing="8">SOFTWARE ENGINEERING</text>
</svg>
